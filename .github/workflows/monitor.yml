name: Bujairami Stock Monitor

on:
  # A code push runs a check right away, so a fix is live (and proven) in
  # about a minute. The bot's own state commits don't match these paths.
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'bujairami_watchlist.json'
      - '.github/workflows/monitor.yml'
      - '!tests/**'
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:

concurrency:
  group: bujairami-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # Default is 6 hours. A hung run would hold the concurrency lock that long.
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TZ: America/Los_Angeles
    steps:
      # ref = branch name, so a run that sat in the queue checks out the LATEST
      # state the previous run pushed, not the snapshot from when it was queued.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor (single check)
        env:
          BUJAIRAMI_DISCORD_WEBHOOK: ${{ secrets.BUJAIRAMI_DISCORD_WEBHOOK }}
          DEEP_CHECK_BATCH: "12"
          # GitHub's IPs are often blocked (403) for days. 0 = no "still down"
          # reminders: one "went quiet" ping, then nothing until "recovered".
          HEALTH_REMINDER_HOURS: "0"
        run: python bujairami_monitor.py --once

      - name: Commit updated state and log
        run: |
          git config user.name "bujairami-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bujairami_state.json
          [ -f bujairami_events.log ] && git add bujairami_events.log || true
          [ -f bujairami_health.json ] && git add bujairami_health.json || true
          [ -f bujairami_deep.json ] && git add bujairami_deep.json || true
          git diff --staged --quiet && exit 0
          git commit -m "update state"
          # If something else pushed in the meantime, rebase onto it and retry
          # instead of failing and losing this run's state.
          git push || (git pull --rebase && git push)
